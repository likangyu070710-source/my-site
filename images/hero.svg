<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">A box seen from the side, with a metal arm reaching in to switch it off</title>
  <desc id="heroDesc">A line drawing in section: a closed box with a switch on its front face,
  and a metal arm entering from the right edge of the picture, its finger resting on the switch.</desc>

  <rect width="1200" height="300" fill="#F4F2EC"/>

  <!-- the box, seen from the side. Everything sits 36px higher than the
       first attempt, so the drawing is centred in the frame: a closed lid
       leaves no empty headroom to explain. -->
  <rect x="330" y="76" width="540" height="152" rx="2" fill="#FBFAF7" stroke="#1F2023" stroke-width="4"/>

  <!-- the lid, closed: one heavy seam along the top edge. The hand comes in
       from the side, so an open lid would tell a second, contradictory story:
       things do not leave this box from above. -->
  <line x1="334" y1="76" x2="866" y2="76" stroke="#1F2023" stroke-width="9" stroke-linecap="round"/>

  <!-- the switch on the front face -->
  <rect x="376" y="140" width="104" height="34" rx="17" fill="#FBFAF7" stroke="#1F2023" stroke-width="4"/>
  <circle cx="452" cy="157" r="11" fill="#1F2023"/>

  <!-- the arm runs off the right edge of the picture, so it reads as coming
       from outside the frame rather than as a capsule resting inside it -->
  <g fill="#C2410C">
    <rect x="700" y="128" width="500" height="40" rx="20"/>
    <circle cx="690" cy="148" r="28"/>
    <rect x="476" y="136" width="224" height="24" rx="12"/>
  </g>

  <!-- the plate in the corner -->
  <g stroke="#CFC9BC" stroke-width="3" stroke-linecap="round">
    <line x1="760" y1="192" x2="828" y2="192"/>
    <line x1="760" y1="206" x2="806" y2="206"/>
  </g>
</svg>
