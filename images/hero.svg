<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">A box seen from the side, with a hand reaching in to switch it off</title>
  <desc id="heroDesc">A line drawing in section: a closed box with a switch on its front face,
  and an arm entering from the right edge of the picture to turn that switch off.</desc>

  <rect width="1200" height="300" fill="#F4F2EC"/>

  <!-- the box, seen from the side -->
  <rect x="330" y="112" width="540" height="152" rx="2" fill="#FBFAF7" stroke="#1F2023" stroke-width="4"/>

  <!-- the lid, closed: one heavy seam along the top edge. The hand comes in
       from the side, so an open lid would tell a second, contradictory story:
       things do not leave this box from above. -->
  <line x1="334" y1="112" x2="866" y2="112" stroke="#1F2023" stroke-width="9" stroke-linecap="round"/>

  <!-- the switch on the front face -->
  <rect x="376" y="176" width="104" height="34" rx="17" fill="#FBFAF7" stroke="#1F2023" stroke-width="4"/>
  <circle cx="452" cy="193" r="11" fill="#1F2023"/>

  <!-- the arm: it runs off the right edge of the picture, so it reads as coming
       from outside the frame rather than as a capsule resting inside it -->
  <g fill="#C2410C">
    <rect x="700" y="164" width="500" height="40" rx="20"/>
    <circle cx="690" cy="184" r="28"/>
    <rect x="476" y="172" width="224" height="24" rx="12"/>
  </g>

  <!-- the plate in the corner -->
  <g stroke="#CFC9BC" stroke-width="3" stroke-linecap="round">
    <line x1="760" y1="228" x2="828" y2="228"/>
    <line x1="760" y1="242" x2="806" y2="242"/>
  </g>
</svg>
